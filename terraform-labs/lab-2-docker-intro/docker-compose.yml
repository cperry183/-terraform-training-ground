version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab2-app
    environment:
      ENVIRONMENT: development
      APP_VERSION: 1.0.0
      PORT: 5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - lab2-network

  # Optional: Redis cache for learning multi-container setups
  redis:
    image: redis:7-alpine
    container_name: lab2-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - lab2-network

networks:
  lab2-network:
    driver: bridge
